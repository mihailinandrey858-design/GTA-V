<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./css/style.css">
    <title>CreateX</title>
</head>
<body>
    <header class="site-header">
        <nav class="navbar wrapper" aria-label="Main navigation">
            <a class="brand" href="#" aria-label="CreateX home">
                <img src="./img/logo.svg" alt="CreateX">
            </a>
            <div class="nav-links">
                <a href="#about">About Us</a>
                <a href="#courses">Courses</a>
                <a href="#events">Events</a>
                <a href="#blog">Blog</a>
                <a href="#contacts">Contacts</a>
            </div>
            <div class="nav-actions">
                <a class="consultation-button" href="#consultation">Get consultation</a>
                <a class="account-link" href="#login">
                    <img src="./img/Profile.svg" alt="">
                    <span>Log in / Register</span>
                </a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero wrapper" aria-labelledby="hero-title">
            <img class="hero-shape" src="./img/shapes.svg" alt="" aria-hidden="true">
            <img class="hero-down-shape" src="./img/shapes (1).svg" alt="" aria-hidden="true">
            <div class="hero-copy">
                <a class="showreel" href="#courses">
                    <span class="showreel-icon" aria-hidden="true">
                        <img src="./img/small.svg" alt="">
                    </span>
                    <span>Play showreel</span>
                </a>
                <h1 id="hero-title">Enjoy studying<br>with Createx<br>Online Courses</h1>
                <div class="hero-actions">
                    <a class="hero-button hero-button-outline" href="#about">About us</a>
                    <a class="hero-button hero-button-primary" href="#courses">Explore courses</a>
                </div>
            </div>

            <div class="hero-image">
                <img src="./img.svg" alt="Student taking an online course">
            </div>
        </section>

    </main>
</body>
</html>
